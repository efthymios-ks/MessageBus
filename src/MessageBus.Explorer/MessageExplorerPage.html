<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{EndpointName}} — messages</title>
    <script>
        // Applied before first paint so a stored dark theme does not flash light on reload.
        // Same storage key as Operations so a toggle in one is a toggle in both.
        try {
            var t = localStorage.getItem("ops-theme");
            if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (_) { /* localStorage disabled */ }
    </script>
    <style>
        :root,
        :root[data-theme="light"] {
            --bg-page: #f5f7fb;
            --bg-panel: #ffffff;
            --bg-panel-muted: #eef1f6;
            --bg-success: #e8f6ef;
            --bg-error: #fdecee;
            --border-subtle: #dfe3ea;
            --border-strong: #c4cbd6;
            --text-primary: #1a1f2c;
            --text-muted: #4a5262;
            --text-faint: #7a8394;
            --text-code: #a25a10;
            --color-accent: #2f6ee0;
            --color-accent-strong: #1e57c2;
            --color-success: #157a5c;
            --color-error: #c62828;
            --color-command: #2f6ee0;
            --color-event: #7a4ce0;
        }

        :root[data-theme="dark"] {
            --bg-page: #0f1218;
            --bg-panel: #171b23;
            --bg-panel-muted: #1e2330;
            --bg-success: #0f2620;
            --bg-error: #2a1417;
            --border-subtle: #2a2f3d;
            --border-strong: #3a4152;
            --text-primary: #e6eaf2;
            --text-muted: #9ba3b3;
            --text-faint: #6b7385;
            --text-code: #e8c690;
            --color-accent: #4c8dff;
            --color-accent-strong: #2f6ee0;
            --color-success: #4ec9b0;
            --color-error: #e5484d;
            --color-command: #4c8dff;
            --color-event: #a67bff;
        }

        :root {
            --font-mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font: 13px/1.5 var(--font-sans);
            color: var(--text-primary);
            background: var(--bg-page);
            min-height: 100vh;
        }

        header.topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-subtle);
        }

        .topbar .titles { flex: 1; min-width: 0; }
        .topbar .title { font-size: 15px; font-weight: 600; }
        .topbar .breadcrumbs { color: var(--text-faint); font-size: 12px; }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            border-radius: 4px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }

        .icon-btn:hover { background: var(--bg-panel-muted); }

        .content {
            padding: 20px 24px 40px;
            max-width: 960px;
            margin: 0 auto;
        }

        .banner {
            margin-bottom: 16px;
            padding: 12px 14px;
            border: 1px solid var(--border-strong);
            background: var(--bg-panel);
            border-radius: 6px;
        }

        .banner.success {
            border-color: var(--color-success);
            background: var(--bg-success);
            color: var(--color-success);
        }

        .banner.error {
            border-color: var(--color-error);
            background: var(--bg-error);
            color: var(--color-error);
        }

        .card {
            border: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
        }

        .card header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 0;
            background: transparent;
            border-bottom: 0;
        }

        .card h2 {
            font-size: 13px;
            margin: 0;
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            word-break: break-all;
        }

        .card .handlers {
            color: var(--text-faint);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 10px;
        }

        .card .actions {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid transparent;
        }

        .badge.kind-command {
            color: var(--color-command);
            border-color: var(--color-command);
            background: transparent;
        }

        .badge.kind-event {
            color: var(--color-event);
            border-color: var(--color-event);
            background: transparent;
        }

        textarea {
            display: block;
            width: 100%;
            background: var(--bg-panel-muted);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 4px;
            font: 12px/1.5 var(--font-mono);
            resize: vertical;
            min-height: 90px;
        }

        .btn {
            background: var(--bg-panel-muted);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            padding: 5px 12px;
            border-radius: 4px;
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn:hover { border-color: var(--text-faint); }

        .btn.primary {
            background: var(--color-accent-strong);
            border-color: var(--color-accent);
            color: white;
        }

        .btn.primary:hover { background: var(--color-accent); }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--text-faint);
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="titles">
            <div class="title">{{EndpointName}}</div>
            <div class="breadcrumbs">Every message this endpoint handles, with a payload of the right shape to edit and send.</div>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <span id="theme-icon">☀</span>
        </button>
    </header>
    <div class="content">
        {{Notices}}
        {{Sections}}
    </div>
    <script>
        (function () {
            var root = document.documentElement;
            var icon = document.getElementById("theme-icon");
            function applyIcon() {
                icon.textContent = root.getAttribute("data-theme") === "dark" ? "☾" : "☀";
            }
            applyIcon();
            document.getElementById("theme-toggle").addEventListener("click", function () {
                var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("ops-theme", next); } catch (_) { /* localStorage disabled */ }
                applyIcon();
            });
        })();
    </script>
</body>
</html>
